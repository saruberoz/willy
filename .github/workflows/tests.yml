name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (guardrails, undo, rescue, identity)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Shell scripts parse
        run: |
          bash -n start.sh
          bash -n setup-usb.sh
